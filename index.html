      padding: 17px 26px;
      border: 1px solid rgba(190,255,225,.52);
      border-radius: 12px;
      background: linear-gradient(135deg, #12bd78 0%, #008c59 58%, #006b47 100%);
      color: #fff;
      text-decoration: none;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .055em;
      font-size: clamp(15px, 3.8vw, 19px);
      font-weight: 800;
      box-shadow:
        0 12px 34px rgba(0,0,0,.34),
        0 0 28px rgba(0,180,112,.20),
        inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .arrow { font-size: 23px; line-height: 1; font-weight: 500; }

      .cta { min-height: 66px; font-size: 18px; }
      .hero::before { background-position: center 53%; }
    }
    @media (max-width: 420px) {
      .hero::before { background-position: 54% center; }
      .cta { min-height: 58px; border-radius: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cta { transition: none; }
    }
